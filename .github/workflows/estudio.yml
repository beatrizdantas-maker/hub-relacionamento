name: Estúdio · verificação

on:
  push:
    paths: ["estudio/**", ".github/workflows/estudio.yml"]
  pull_request:
    paths: ["estudio/**", ".github/workflows/estudio.yml"]

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: estudio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          ESTUDIO_PREVIEW: "1"
      - name: Acessibilidade (axe, WCAG 2.1 AA), 360px e erros de console em todas as telas
        env:
          ESTUDIO_PREVIEW: "1"
          ESTUDIO_URL: http://localhost:3000
        run: |
          npx playwright install --with-deps chromium
          (npm start > servidor.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/entrar && break; sleep 2; done
          npm run test:a11y

  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Simula o auth do Supabase, aplica as migrations e roda o teste de RLS
        working-directory: estudio
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/auth_shim.sql
          for f in supabase/migrations/*.sql; do psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/rls.sql 2>&1 | tee saida.txt
          grep -q "RLS OK" saida.txt
